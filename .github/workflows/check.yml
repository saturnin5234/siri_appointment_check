name: Check SIRI appointments

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs)
  workflow_dispatch:         # lets you start a run manually to test
    inputs:
      test_notify:
        description: "Only send a test push notification, skip the check"
        type: boolean
        default: false

concurrency:
  group: siri-check
  cancel-in-progress: false

permissions:
  contents: write            # needed to save state.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Run check
        env:
          SESSION_COOKIE: ${{ secrets.SESSION_COOKIE }}
          BOOKING_SESSION_KEY: ${{ secrets.BOOKING_SESSION_KEY }}
          NOT_PUBLIC_TOKEN: ${{ secrets.NOT_PUBLIC_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CURRENT_APPOINTMENT: "2026-11-02"   # edit if your appointment changes
          TEST_NOTIFY: ${{ inputs.test_notify && '1' || '' }}
        run: python3 check_once.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update state"
            git push
          fi
